name: Update Packages
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Brave
        run: |
          chmod +x pkgs/brave/update.sh
          ./pkgs/brave/update.sh
      - name: Update Zen Browser
        run: |
          chmod +x pkgs/zen/update.sh
          ./pkgs/zen/update.sh
      - name: Commit updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update package versions"
          file_pattern: "pkgs/*/versions.json"
